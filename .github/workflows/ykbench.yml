name: Yk Bench

on: [pull_request, workflow_dispatch]

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    name: Build + haste bench yksompp+Yk
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pavel-durov/yk-build:latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache rust + haste build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: haste-${{ runner.os }}-${{ hashFiles('.github/workflows/ykbench.yml') }}
          restore-keys: haste-${{ runner.os }}-

      - name: Install harness deps
        run: apt-get update && apt-get install -y --no-install-recommends bc gettext-base curl jq

      - name: Install rust (if not cached)
        run: |
          if ! command -v cargo >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install haste (if not cached)
        run: command -v haste >/dev/null || cargo install --git https://github.com/ykjit/haste

      - name: Clone yk-benchmarks
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/ykjit/yk-benchmarks .bench-work/yk-benchmarks

      - name: Build + test SOM++ against prebuilt Yk
        run: scripts/yk/build-and-test.sh

      - name: Run haste bench
        run: |
          start=$(date +%s)
          scripts/yk/bench.sh \
            yk-build/SOM++ \
            Smalltalk \
            .bench-work/yk-benchmarks \
            "ci ${{ github.sha }}" 2>&1 | tee bench.out
          dur=$(( $(date +%s) - start ))
          printf 'BENCH_DURATION=%dm%02ds\n' $((dur / 60)) $((dur % 60)) >> "$GITHUB_ENV"

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SRC_SHA: ${{ github.event.pull_request.head.sha }}
          SRC_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Prefer the haste-diff block emitted at the end of bench.out; on
          # bench failure it's missing, so fall back to the tail for triage.
          awk '/^Datum[0-9]+:/{keep=1} keep' bench.out > tail.out
          [ -s tail.out ] || tail -c 8000 bench.out > tail.out
          jq -Rs --arg src "$SRC_SHA" --arg srcurl "$SRC_URL" --arg run "$RUN_URL" --arg dur "$BENCH_DURATION" \
            '{body: ("### Haste bench\nyksompp commit: [`" + $src + "`](" + $srcurl + ")\nduration: " + $dur + "\n```\n" + . + "\n```\n\n[workflow run](" + $run + ")")}' \
            < tail.out > body.json
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR/comments" \
            -d @body.json
