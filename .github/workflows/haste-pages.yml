name: Haste pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request_target:
    types: [opened]

jobs:
  pages:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
    steps:
      - uses: ykjit/haste-pages/action/build@50d4a4153a094af5bd2b90a7b38c44c924c0edea
      - id: deploy
        uses: actions/deploy-pages@v4
  remind:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: ykjit/haste-pages/action/remind@50d4a4153a094af5bd2b90a7b38c44c924c0edea
